name: pack-zim
on:
  workflow_dispatch:
    inputs:
      slug: {description: "content/<slug>.html の slug", required: true}
      title: {description: "ZIMタイトル", required: false, default: ""}
      lang: {description: "言語", required: false, default: "ja"}
  push:
    branches: [main]
    paths: ["content/*.html"]
permissions: {contents: write}
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs: {slugs: "${{ steps.slugs.outputs.slugs }}"}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: slugs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo 'slugs=["${{ github.event.inputs.slug }}"]' >> "$GITHUB_OUTPUT"
          else
            FILES=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'content/*.html' || git ls-tree -r --name-only HEAD -- 'content/*.html')
            python3 - "$FILES" >> "$GITHUB_OUTPUT" <<'PY'
          import json,pathlib,sys
          print("slugs="+json.dumps([pathlib.Path(x).stem for x in sys.argv[1].splitlines() if x]))
          PY
          fi
  pack:
    needs: detect
    if: needs.detect.outputs.slugs != '[]'
    strategy:
      matrix: {slug: "${{ fromJSON(needs.detect.outputs.slugs) }}"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install libzim
      - name: pack
        run: |
          SLUG="${{ matrix.slug }}"; TITLE=""
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then TITLE="${{ github.event.inputs.title }}"; fi
          ARGS=(--lang "${{ github.event.inputs.lang || 'ja' }}"); [ -n "$TITLE" ] && ARGS+=(--title "$TITLE")
          python3 zim_pack.py "content/$SLUG.html" "$SLUG.zim" "${ARGS[@]}"
          ZIM_TITLE=$(python3 - "$SLUG.zim" <<'PY'
          import sys
          from libzim.reader import Archive
          z=Archive(sys.argv[1])
          print(z.get_metadata("Title"))
          PY
          )
          echo "ZIM_TITLE=$ZIM_TITLE" >> "$GITHUB_ENV"
      - name: release
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          SLUG="${{ matrix.slug }}"
          gh release delete "$SLUG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$SLUG" --title "$ZIM_TITLE" --notes "auto-packed by zimrelease2 CI"
          gh release upload "$SLUG" "$SLUG.zim#${ZIM_TITLE}#application/x-openzim"
