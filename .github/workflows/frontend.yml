name: Frontend regression tests
on:
  pull_request:
  push:
    branches: [main]
    paths: ['index.html', 'sw.js', 'tests/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.cjs
