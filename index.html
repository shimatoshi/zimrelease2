<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ZIM Release 2</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#111;color:#eee}h1{font-size:1.5rem}.item{padding:16px 0;border-top:1px solid #333}.tag{color:#aaa;font-size:.9rem}a{color:#8cc8ff}button{background:#eee;color:#111;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}</style><h1>ZIM Release 2</h1><p>GitHub Releases にある ZIM をブラウザから取得できます。</p><main id="list">読み込み中…</main><script>
(async()=>{const el=document.querySelector('#list');try{const rs=await fetch('https://api.github.com/repos/shimatoshi/zimrelease2/releases?per_page=100').then(r=>r.json());if(!rs.length){el.textContent='まだZIMはありません。';return}el.innerHTML=rs.map(r=>r.assets.filter(a=>a.name.endsWith('.zim')).map(a=>`<div class="item"><b>${a.name}</b><div class="tag">${r.tag_name} · ${(a.size/1048576).toFixed(1)} MB</div><p><a href="${a.browser_download_url}"><button>ダウンロード</button></a></p></div>`).join('')).join('')||'ZIM asset はまだありません。'}catch(e){el.textContent='Release一覧を取得できませんでした。'}})();
</script></html>
