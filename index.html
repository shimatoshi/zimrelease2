<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZIM Library</title>
<style>
:root{color-scheme:dark;--bg:#0d0f12;--panel:#15181d;--line:#292e36;--text:#f3f5f7;--muted:#9ba3ad;--accent:#8cc8ff}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;max-width:920px;margin:0 auto;padding:40px 18px 72px;background:var(--bg);color:var(--text)}
header{margin-bottom:36px}h1{font-size:1.75rem;margin:0 0 8px}.lead{color:var(--muted);margin:0}
.category{margin-top:36px}.category-head{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
.category h2{font-size:1.15rem;margin:0}.count{font-size:.8rem;color:var(--muted)}
.grid{display:grid;gap:12px}
.item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.info{min-width:0}.title{font-weight:700;font-size:1rem;overflow-wrap:anywhere}.tag{color:var(--muted);font-size:.84rem;margin-top:5px}
a.download{flex:none;background:#eee;color:#111;text-decoration:none;border-radius:8px;padding:9px 13px;font-weight:700;font-size:.9rem}
.err{color:#ffb4b4}.empty{color:var(--muted)}
@media(max-width:560px){body{padding-top:28px}.item{align-items:flex-start;flex-direction:column}.download{width:100%;text-align:center}}
</style>
</head>
<body>
<header><h1>ZIM Library</h1><p class="lead">オフラインで閲覧できるZIMアーカイブ</p></header>
<main id="list">読み込み中…</main>
<script>
const CATEGORY_RULES=[
  ['生物・自然科学',/(biology|bio|fish|goby|rhinogobius|yoshinobori|kurodai|nature|ecology|science|ヨシノボリ|クロダハゼ|生物|自然|魚)/i],
  ['技術・IT',/(tech|software|program|code|computer|android|linux|ai|llm|web|技術|it)/i],
  ['歴史・社会',/(history|society|politic|econom|culture|歴史|社会|政治|経済|文化)/i]
];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function titleFromName(name){
  return name.replace(/\.zim$/i,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
}
function categoryFor(item){
  if(item.category)return item.category;
  const text=[item.title,item.a.name,item.r.name,item.r.tag_name].filter(Boolean).join(' ');
  return (CATEGORY_RULES.find(([,re])=>re.test(text))||['その他'])[0];
}
(async()=>{
  const el=document.querySelector('#list');
  try{
    const res=await fetch('/api/releases',{cache:'no-store'});
    const data=await res.json();
    if(!res.ok)throw new Error(data.message||('HTTP '+res.status));
    if(!Array.isArray(data))throw new Error('Release API response is invalid');
    const items=data.flatMap(r=>(r.assets||[])
      .filter(a=>a.name.toLowerCase().endsWith('.zim'))
      .map(a=>({a,r,title:a.label||titleFromName(a.name),category:a.category||null})));
    if(!items.length){el.innerHTML='<p class="empty">公開済みReleaseにZIM assetはありません。</p>';return}
    const groups=new Map();
    for(const item of items){const c=categoryFor(item);if(!groups.has(c))groups.set(c,[]);groups.get(c).push(item)}
    const preferred=['生物・自然科学','技術・IT','歴史・社会','その他'];
    const cats=[...groups.keys()].sort((a,b)=>{
      const ai=preferred.indexOf(a),bi=preferred.indexOf(b);
      return (ai<0?999:ai)-(bi<0?999:bi)||a.localeCompare(b,'ja');
    });
    el.innerHTML=cats.map(cat=>{
      const list=groups.get(cat);
      return '<section class="category"><div class="category-head"><h2>'+esc(cat)+'</h2><span class="count">'+list.length+'件</span></div><div class="grid">'+
      list.map(({a,r,title})=>'<article class="item"><div class="info"><div class="title">'+esc(title)+'</div><div class="tag">'+esc(r.tag_name||'Release')+' · '+(a.size/1048576).toFixed(1)+' MB</div></div><a class="download" href="'+esc(a.browser_download_url)+'">ダウンロード</a></article>').join('')+
      '</div></section>';
    }).join('');
  }catch(e){el.innerHTML='<p class="err">Release一覧の取得に失敗しました: '+esc(e.message||e)+'</p>'}
})();
</script>
</body>
</html>
